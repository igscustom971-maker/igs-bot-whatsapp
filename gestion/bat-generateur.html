<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Générateur de BAT · IGS DASHBOARD</title>
<style>
:root{--ink:#1e1b4b;--pink:#e91e8c;--line:#e5e7eb;--soft:#f5f3ff;--muted:#6b7280;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#f4f3fa}
header.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(90deg,#fde2f0,#ede9fe);position:sticky;top:0;z-index:5}
header.bar h1{font-size:17px;margin:0;flex:1}
header.bar a{color:var(--ink);font-weight:600;text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn:disabled{opacity:.5;cursor:default}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;max-width:1700px;margin:0 auto}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.msg{display:none;margin-top:8px;padding:8px 10px;border-radius:8px;font-size:13px}
.msg.on{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.info{background:#eef2ff;color:#3730a3}
label.f{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:8px 0 3px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%}
textarea{min-height:52px}
.row{display:flex;gap:6px;align-items:center}
.row > *{flex:1}
.pl{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--soft)}
.pl .row{margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.coul{display:flex;align-items:center;gap:6px;margin:3px 0}
.coul input[type=color]{width:34px;height:26px;padding:0;border:0}
.coul input[type=checkbox]{width:auto}
.previews{display:flex;flex-direction:column;gap:18px;align-items:center}
.scaler{transform-origin:top left}
/* ----- Page A4 paysage (1123 x 794 px) ----- */
.page{width:1123px;height:794px;background:#fff;position:relative;padding:22px 30px 18px;box-shadow:0 6px 30px rgba(30,27,75,.15);font-family:Arial,Helvetica,sans-serif;color:#1e1b4b;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#fbd5ea,#e9d5ff);border-radius:6px;padding:12px 18px;height:68px}
.ph .t{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:900;letter-spacing:.5px}
.ph .t img{height:42px}
.ph .r{text-align:right;font-size:12px;line-height:1.75}
.ph .r b{font-weight:800}
.frame{margin-top:12px;border:2px solid #4c9a2a;border-radius:8px;height:420px;position:relative;overflow:hidden;background:#f6f6f6;display:flex;align-items:center;justify-content:center}
.frame .fond{position:absolute;inset:0;background:linear-gradient(135deg,#c7b8f0 0%,#f6c6df 55%,#f3a6c8 100%)}
.frame canvas{position:relative;z-index:1;cursor:grab}
.frame .legende{position:absolute;left:0;right:0;bottom:8px;z-index:2;text-align:center;font-weight:900;font-size:24px;line-height:1.15;white-space:pre-line;color:#111}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.trio div{background:#f3f3f5;border-radius:6px;padding:6px 10px 8px}
.trio small{display:block;font-size:9px;color:#666;text-transform:uppercase;letter-spacing:.3px}
.trio b{display:block;font-size:13px;border-bottom:1px dashed #bbb;padding-bottom:3px;min-height:19px}
table.t{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;border:1px solid #ddd;border-radius:6px;overflow:hidden;font-size:11px}
table.t th{background:#1f1b4d;color:#fff;text-align:left;font-size:10px;letter-spacing:.3px;padding:7px 10px}
table.t td{padding:8px 10px;vertical-align:top;white-space:pre-line}
.zone{font-weight:800;font-size:11px;padding:2px 10px 8px}
.pied{position:absolute;left:30px;right:30px;bottom:12px;font-size:8.5px;color:#555;display:flex;justify-content:space-between;gap:20px}
.pied .sig{border:1px solid #bbb;border-radius:4px;width:220px;height:34px;padding:3px 6px;font-size:8.5px;flex:none}
</style>
</head>
<body>
<header class="bar">
  <a href="/gestion/commandes#bat">← BAT</a>
  <h1 id="titre">Générateur de BAT</h1>
  <button class="btn" id="dl" disabled>⬇ Télécharger le PDF</button>
  <button class="btn pink" id="save" disabled>💾 Enregistrer dans le dossier</button>
</header>
<div class="wrap">
  <div>
    <div class="tabs" id="tabs"></div>
    <div class="previews" id="previews"><div class="card">Chargement de la commande…</div></div>
  </div>
  <div class="side">
    <div class="card" id="reglages"></div>
    <div class="card"><div class="note">Glisse un logo sur un mockup pour le déplacer (le réglage s'applique à toutes les couleurs de la page). Les tailles sont en cm réels : la taille des logos suit la largeur réelle du vêtement (fournisseur, taille M).</div><div class="msg" id="msg"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/gestion/bat-commun.js"></script>
<script>
'use strict';
// ============================================
// GÉNÉRATEUR DE BAT - IGS CUSTOM BAR
// Gabarits blancs recolorés, logos placés à l'échelle (cm réels), une page par visuel, PDF A4 paysage.
// ============================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const cle = decodeURIComponent(location.pathname.split('/').pop());

// Règles communes avec le BAT automatique du serveur (produits, zones, nuancier, pages, positions) : /gestion/bat-commun.js
const BC = BATCOMMUN.creer();
const { PRODUITS, ZONES } = BC;
const { produitDe, hexCouleur, parserZones } = BATCOMMUN;

// ---------- Chargement des images ----------
const cacheImg = new Map();
function charger(url){
  if (!cacheImg.has(url)) cacheImg.set(url, new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Image introuvable : ' + url)); i.src = url; }));
  return cacheImg.get(url);
}
// Mesure du gabarit : corps (largeur à 60 % de la hauteur), centre, haut du corps du tote
const mesures = new Map();
async function gabarit(nom){
  const img = await charger('/gestion/gabarits/' + nom + '.png');
  if (!mesures.has(nom)) {
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, img.width, img.height).data;
    mesures.set(nom, Object.assign({ img }, BATCOMMUN.mesurer(nom, img.width, img.height, (i, y) => d[(y * img.width + i) * 4 + 3])));
  }
  return mesures.get(nom);
}
const centreA = (m, y) => BC.centreA(m, y);
// Logo : marges (transparentes ou blanches) rognées automatiquement -> la largeur en cm est celle du dessin visible ;
// option "fond blanc transparent" pour les JPG à fond blanc. Logos importés depuis l'ordinateur : id "local-…"
const cacheLogo = new Map(), logosLocaux = new Map(), RATIOS = new Map();
async function logo(id, sansBlanc){
  const k = id + '|' + String(sansBlanc);
  if (!cacheLogo.has(k)) cacheLogo.set(k, (async () => {
    const img = await charger(logosLocaux.get(id) || ('/gestion/api/fichier/' + encodeURIComponent(id)));
    const W = img.naturalWidth, H = img.naturalHeight;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, W, H), p = d.data;
    const coins0 = [0, (W - 1) * 4, (H - 1) * W * 4, ((H - 1) * W + W - 1) * 4];
    const opaque = !coins0.some(i => p[i + 3] < 16);
    sansBlanc = sansBlanc === true || (sansBlanc === 'auto' && opaque);
    if (sansBlanc) for (let i = 0; i < p.length; i += 4) { const m = Math.min(p[i], p[i+1], p[i+2]); if (m > 235) p[i+3] = 0; else if (m > 215) p[i+3] = Math.min(p[i+3], (235 - m) * 12); }
    // Image avec transparence : on rogne sur la transparence ; sinon sur le fond blanc
    const coins = [0, (W - 1) * 4, (H - 1) * W * 4, ((H - 1) * W + W - 1) * 4];
    const transparente = sansBlanc || coins.some(i => p[i + 3] < 16);
    const plein = i => transparente ? p[i + 3] > 16 : (p[i + 3] > 16 && Math.min(p[i], p[i+1], p[i+2]) < 242);
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y += 1) for (let xx = 0; xx < W; xx += 1) { if (plein((y * W + xx) * 4)) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
    if (sansBlanc) x.putImageData(d, 0, 0);
    if (x1 < 0) return c;
    const marge = 2, cw = Math.min(W, x1 - x0 + 1 + marge * 2), chh = Math.min(H, y1 - y0 + 1 + marge * 2);
    const o = document.createElement('canvas'); o.width = cw; o.height = chh;
    o.getContext('2d').drawImage(c, Math.max(0, x0 - marge), Math.max(0, y0 - marge), cw, chh, 0, 0, cw, chh);
    return o;
  })());
  return cacheLogo.get(k);
}

// ---------- État ----------
let C = null, D = null, pages = [], courante = 0;
const RESOLUTION = 2; // canvas des mockups en double résolution (net à l'impression)

function msg(t, k){ const m = $('msg'); m.className = 'msg on ' + k; m.innerHTML = t; }

// Positions par défaut réglées par l'atelier (📌), enregistrées sur le serveur : décalages en cm par produit et zone
let ADMIN = false, NUANCIER = [];
async function chargerPositions(){
  try {
    const j = await (await fetch('/gestion/api/bat/positions')).json();
    ADMIN = !!j.admin;
    BC.appliquerPositions(j.positions || {});
  } catch(e){}
}
const VIERGE = cle === 'vierge';
async function init(){
  await chargerPositions();
  try { const l = await (await fetch('/gestion/api/listes')).json(); NUANCIER = (l && l.couleurs) || []; } catch(e){}
  if (!NUANCIER.length) NUANCIER = BATCOMMUN.NUANCIER_DEFAUT.slice();
  if (VIERGE) {
    // BAT vierge : aucune commande, tout se remplit à la main (logos importés depuis l'ordinateur), PDF téléchargé
    C = { cle: 'vierge', n_devis: '', client: '', email: '', zone_flocage: '' };
    D = { trouve: true, visuels: [], tailles: { groupes: [] } };
    $('titre').textContent = 'BAT vierge';
    $('save').style.display = 'none';
    construirePages(); afficherTout(); $('dl').disabled = false;
    msg('BAT vierge : clique sur Ref devis, Client et Email dans l\'en-tête pour les remplir, importe tes logos avec « ＋ Logo depuis l\'ordinateur », puis télécharge le PDF.', 'info');
    return;
  }
  try {
    const rc = await fetch('/gestion/api/commandes'); if (rc.status === 401) return location.href = '/gestion/auth/login';
    const jc = await rc.json();
    C = (jc.commandes || []).find(x => x.cle === cle);
    if (!C) throw new Error('Commande introuvable (elle est peut-être livrée ou supprimée)');
    $('titre').textContent = 'Générateur de BAT · ' + (C.n_devis || '') + ' · ' + C.client;
    const rd = await fetch('/gestion/api/commandes/' + encodeURIComponent(C.n_devis) + '/dossier');
    D = await rd.json();
    if (D.erreur) throw new Error(D.erreur);
    if (!D.trouve) throw new Error('Dossier de la commande introuvable dans SharePoint');
    construirePages();
    afficherTout();
    if (!(D.visuels || []).length) msg('Aucun visuel dans le dossier : importe le logo avec « ＋ Logo depuis l\'ordinateur ».', 'info');
    $('dl').disabled = false; $('save').disabled = false;
    if (D.bat) msg('ℹ️ Un « BON A TIRER.pdf » existe déjà dans le dossier : l\'enregistrement le remplacera.', 'info');
  } catch(e){ $('previews').innerHTML = '<div class="card msg on err">' + esc(e.message) + '</div>'; }
}

function construirePages(){ pages = BC.construirePages(C, D, { vierge: VIERGE }); }

// ---------- Rendu d'un mockup (gabarit recoloré + logos) ----------
const rectLogo = (pl, a, face, m, img) => BC.rectLogo(pl, a, face, m, img.width, img.height);
const placementsDe = (page, face, a) => BC.placementsDe(page, face, a);
const totePlacement = page => BC.totePlacement(page);
const cacheTeint = new Map();
function teinte(m, nom, hex){
  const k = nom + '|' + hex;
  if (!cacheTeint.has(k)) {
    const c = document.createElement('canvas'); c.width = m.img.width; c.height = m.img.height;
    const x = c.getContext('2d');
    // Recoloration : couleur pleine x gabarit blanc (ombres conservées), découpée à la forme du gabarit
    x.fillStyle = hex; x.fillRect(0, 0, c.width, c.height);
    x.globalCompositeOperation = 'multiply'; x.drawImage(m.img, 0, 0);
    x.globalCompositeOperation = 'destination-in'; x.drawImage(m.img, 0, 0);
    cacheTeint.set(k, c);
  }
  return cacheTeint.get(k);
}
async function vignette(page, a, face){
  const p = PRODUITS[a.produit];
  const nom = face === 'dos' ? p.dos : p.avant;
  const m = await gabarit(nom);
  const c = document.createElement('canvas'); c.width = m.img.width; c.height = m.img.height;
  const x = c.getContext('2d');
  x.drawImage(teinte(m, nom, a.hex), 0, 0);
  const zonesHit = [];
  for (const pl of placementsDe(page, face, a)) {
    const img = await logo(pl.image, pl.sansBlanc).catch(() => null); if (!img) continue;
    RATIOS.set(pl.image, img.height / img.width);
    const r = rectLogo(pl, a, face, m, img);
    x.save(); x.translate(r.x + r.w / 2, r.y + r.h / 2); x.rotate(r.rot * Math.PI / 180); x.drawImage(img, -r.w / 2, -r.h / 2, r.w, r.h); x.restore();
    zonesHit.push({ pl, r });
  }
  return { canvas: c, hits: zonesHit, m };
}
// Toutes les vignettes de la page dans un seul canvas (devant puis dos pour chaque couleur)
function afficherAlertes(i){
  const page = pages[i], el = $('al' + i); if (!el) return;
  page._alertes = BC.alertes(page, RATIOS);
  el.innerHTML = page._alertes.length ? '<div class="msg on err" style="margin:0 0 8px">⚠️ <b>Visuel trop grand</b> (n\'apparaît pas sur le PDF) :<br>' + page._alertes.map(a => esc(a.message)).join('<br>') + '</div>' : '';
  if (i === courante) alertesPanneau();
}
function alertesPanneau(){
  const page = pages[courante]; if (!page || !page._alertes) return;
  document.querySelectorAll('#reglages [data-alerte]').forEach(x => { const pl = page.placements[x.dataset.alerte]; const al = page._alertes.filter(a => a.placement === pl || (a.placement.tote && pl === page.placements[0])); x.innerHTML = al.length ? '⚠️ ' + al.map(a => esc(a.message)).join('<br>⚠️ ') : ''; });
}
async function dessinerMockups(i, guides = null){
  const page = pages[i], el = document.querySelector('#page' + i + ' canvas'); if (!el) return;
  const items = [];
  for (const vg of BC.vignettesDe(page)) items.push({ a: vg.a, f: vg.f, v: await vignette(page, vg.a, vg.f) });
  const W = 1059, H = page.legende.trim() ? 330 : 412;
  el.width = W * RESOLUTION; el.height = H * RESOLUTION; el.style.width = W + 'px'; el.style.height = H + 'px';
  const x = el.getContext('2d'); x.clearRect(0, 0, el.width, el.height);
  const cells = BC.grille(items.length, W, H, items.map(it => ({ w: it.v.canvas.width, h: it.v.canvas.height })));
  page._cells = [];
  items.forEach((it, k) => {
    const im = it.v.canvas, { px, py, s, w, h } = cells[k];
    x.drawImage(im, px * RESOLUTION, py * RESOLUTION, w * RESOLUTION, h * RESOLUTION);
    page._cells.push({ px, py, s, it });
    // Repères (écran uniquement, pendant le déplacement) : axe central du vêtement, axes du logo
    const hit = guides && it.v.hits.find(h => h.pl === guides);
    if (hit) {
      // Repères fixes : axe central, axe du cœur (1-2 cm après le col, côté cœur), ligne de hauteur de la zone
      const R = RESOLUTION, X = v => (px + v * s) * R, Y = v => (py + v * s) * R, m = it.v.m, Pd = PRODUITS[it.a.produit];
      const cxLogo = hit.r.x + hit.r.w / 2, ligne = (x1, y1, x2, y2, coul, pointille) => { x.strokeStyle = coul; x.setLineDash(pointille ? [6 * R, 4 * R] : []); x.beginPath(); x.moveTo(X(x1), Y(y1)); x.lineTo(X(x2), Y(y2)); x.stroke(); };
      x.save(); x.lineWidth = 1.5 * R;
      const cxV = centreA(m, hit.r.y + hit.r.h / 2);
      ligne(cxV, 0, cxV, m.img.height, Math.abs(cxLogo - cxV) < 2 ? '#16a34a' : 'rgba(220,38,38,.85)', true);
      let surAxe = Math.abs(cxLogo - cxV) < 2;
      if (!Pd.tote && it.f === 'avant' && Pd.zones.coeur) {
        const zc = Pd.zones.coeur, xc = cxV + (zc.x + (zc.ddx || 0)) * hit.r.pxW, ok = Math.abs(cxLogo - xc) < 2;
        if (guides.zone === 'coeur') surAxe = ok;
        ligne(xc, 0, xc, m.img.height, ok ? '#16a34a' : 'rgba(37,99,235,.85)', true);
      }
      const zd = Pd.tote ? null : (Pd.zones[guides.zone] || Pd.zones.poitrine);
      // Logo centré sur son axe ET à la bonne hauteur : les lignes passent au vert ensemble
      if (zd && zd.y != null) { const yl = (zd.y + (zd.ddy || 0)) * hit.r.pxH, okH = Math.abs(hit.r.y - yl) < 2; ligne(0, yl, m.img.width, yl, okH && surAxe ? '#16a34a' : okH ? 'rgba(234,88,12,.9)' : 'rgba(220,38,38,.85)', false); }
      x.setLineDash([]); x.strokeStyle = 'rgba(220,38,38,.9)'; x.strokeRect(X(hit.r.x), Y(hit.r.y), hit.r.w * s * R, hit.r.h * s * R);
      x.restore();
    }
  });
  afficherAlertes(i);
}

// ---------- Page HTML (aperçu = rendu PDF) ----------
const edG = k => '<span contenteditable="true" data-g="' + k + '" style="display:inline-block;min-width:' + (C[k] ? 0 : 70) + 'px;' + (C[k] ? '' : 'border-bottom:1px dashed #999') + '">' + esc(C[k] || '') + '</span>';
function pageHtml(p, i){
  const d = new Date().toLocaleDateString('fr-FR');
  const ed = (k, v, ph) => '<span contenteditable="true" data-i="' + i + '" data-k="' + k + '"' + (ph ? ' data-ph="' + esc(ph) + '"' : '') + '>' + esc(v) + '</span>';
  return '<div id="al' + i + '" style="width:100%;max-width:1123px"></div><div class="scaler" id="sc' + i + '"><div class="page" id="page' + i + '">'
    + '<div class="ph"><div class="t"><img src="/gestion/gabarits/logo-igs.png" alt="">BON A TIRER</div>'
    + '<div class="r"><b>Ref devis :</b> ' + edG('n_devis') + ' &nbsp;<b>Date du BAT :</b> ' + d + '<br><b>Client :</b> ' + edG('client') + ' &nbsp;<b>Email :</b> ' + edG('email') + '</div></div>'
    + '<div class="frame"><div class="fond"></div><canvas></canvas>' + (p.legende.trim() ? '<div class="legende">' + esc(p.legende) + '</div>' : '') + '</div>'
    + '<div class="trio"><div><small>Modèle</small><b>' + ed('modele', p.modele) + '</b></div><div><small>Couleur</small><b>' + ed('couleur', p.couleur) + '</b></div><div><small>Quantité</small><b>' + ed('quantite', p.quantite) + '</b></div></div>'
    + '<table class="t"><tr><th style="width:22%">DESCRIPTION</th><th style="width:22%">TAILLES</th><th>FACE</th><th>DOS</th><th>AUTRES</th></tr>'
    + '<tr><td>ZONE DE FLOCAGE' + (pages.length > 1 ? '<br><b>Visuel : ' + esc(p.titre) + '</b>' : '') + '</td><td>' + ed('tailles', p.tailles) + '</td><td>' + ed('face', p.face) + '</td><td>' + ed('dos', p.dos) + '</td><td>' + ed('autres', p.autres) + '</td></tr>'
    + '<tr><td colspan="5" class="zone">' + ed('zone', p.zone) + '</td></tr></table>'

function positionTexte(p, pl){

  const dx = pl.dx + (zd.ddx || 0), dy = pl.dy + (zd.ddy || 0), r = n => (Math.round(n * 2) / 2).toString().replace('.', ',');
  if (P.tote) return '📏 ' + r(zd.x + dx) + ' cm du centre · centre du logo à ' + r(zd.yCentre + dy) + ' cm du haut du sac · largeur ' + r(pl.largeur) + ' cm';

function pointCanvas(e, canvas){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (canvas.width / RESOLUTION) / r.width, y: (e.clientY - r.top) * (canvas.height / RESOLUTION) / r.height };
}

    const hit = cell.it.v.hits.slice().reverse().find(h => gx >= h.r.x && gx <= h.r.x + h.r.w && gy >= h.r.y && gy <= h.r.y + h.r.h);
    if (hit) {
      courante = i; reglages();
      drag = { i, cv, cell, pl: hit.pl, r: hit.r, x0: pt.x, y0: pt.y, dx0: hit.pl.dx, dy0: hit.pl.dy, sens: 1 };
      cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; e.preventDefault(); return;
    }
  }
});
$('previews').addEventListener('pointermove', e => {
  if (!drag) return;
  const pt = pointCanvas(e, drag.cv);
  const ddx = (pt.x - drag.x0) / drag.cell.s / drag.r.pxW, ddy = (pt.y - drag.y0) / drag.cell.s / drag.r.pxH;
  drag.pl.dx = Math.round((drag.dx0 + ddx * drag.sens) * 2) / 2; drag.pl.dy = Math.round((drag.dy0 + ddy) * 2) / 2;
  // Aimant : recentré automatiquement à moins de 1 cm de l'axe du vêtement
  const P = PRODUITS[drag.cell.it.a.produit], zd = P.tote ? P.zones.centre : (P.zones[drag.pl.zone] || P.zones.poitrine);
  if (zd.x != null && Math.abs(zd.x + (zd.ddx || 0) + drag.pl.dx) < 1) drag.pl.dx = -(zd.x + (zd.ddx || 0));
  const zc = !P.tote && drag.cell.it.f === 'avant' && P.zones.coeur;
  if (zc && zd.x != null) { const axe = zc.x + (zc.ddx || 0) - (zd.x + (zd.ddx || 0)); if (Math.abs(drag.pl.dx - axe) < 1) drag.pl.dx = axe; }
  if (zd.y != null && Math.abs(drag.pl.dy) < 1) drag.pl.dy = 0;
  majPositions();
  if (!drag.enCours) { drag.enCours = true; const d0 = drag; requestAnimationFrame(async () => { await dessinerMockups(d0.i, d0.pl); d0.enCours = false; }); }
});
$('previews').addEventListener('pointerup', () => { if (drag) { const d0 = drag; drag.cv.style.cursor = 'grab'; drag = null; setTimeout(() => dessinerMockups(d0.i), 30); } });
window.addEventListener('resize', ajusterEchelle);

// ---------- PDF ----------
async function genererPdf(){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  for (let i = 0; i < pages.length; i++) {
    const sc = $('sc' + i), t = sc.style.transform; sc.style.transform = 'none';
    try {
      const canvas = await html2canvas($('page' + i), { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
      if (i) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 297, 210);
    } finally { sc.style.transform = t; }
  }
  return pdf;
}
$('dl').onclick = async () => {
  $('dl').disabled = true; msg('Création du PDF…', 'info');
  try { (await genererPdf()).save('BON A TIRER - ' + (C.n_devis || '') + '.pdf'); msg('✅ PDF téléchargé', 'ok'); }
  catch(e){ msg('❌ ' + esc(e.message), 'err'); } finally { $('dl').disabled = false; }
};
$('save').onclick = async () => {
  if (D.bat && !confirm('Remplacer le « BON A TIRER.pdf » existant dans le dossier ?')) return;
  $('save').disabled = true; msg('Création du PDF et dépôt dans le dossier SharePoint…', 'info');
  try {
    const blob = (await genererPdf()).output('blob');
    const fd = new FormData(); fd.append('pdf', blob, 'BON A TIRER.pdf');
    const r = await fetch('/gestion/api/commandes/' + encodeURIComponent(cle) + '/bat-pdf', { method: 'POST', body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Erreur ' + r.status);
    D.bat = true;
    msg('✅ « BON A TIRER.pdf » enregistré dans le dossier. <a href="/gestion/commandes#bat">Retour à l\'onglet BAT</a> pour l\'envoyer au client.', 'ok');
  } catch(e){ msg('❌ ' + esc(e.message), 'err'); } finally { $('save').disabled = false; }
};
init();
