<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Générateur de BAT · IGS DASHBOARD</title>
<style>
:root{--ink:#1e1b4b;--pink:#e91e8c;--line:#e5e7eb;--soft:#f5f3ff;--muted:#6b7280;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#f4f3fa}
header.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(90deg,#fde2f0,#ede9fe);position:sticky;top:0;z-index:5}
header.bar h1{font-size:17px;margin:0;flex:1}
header.bar a{color:var(--ink);font-weight:600;text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn:disabled{opacity:.5;cursor:default}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;max-width:1700px;margin:0 auto}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.msg{display:none;margin-top:8px;padding:8px 10px;border-radius:8px;font-size:13px}
.msg.on{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.info{background:#eef2ff;color:#3730a3}
label.f{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:8px 0 3px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%}
textarea{min-height:52px}
.row{display:flex;gap:6px;align-items:center}
.row > *{flex:1}
.pl{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--soft)}
.pl .row{margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.coul{display:flex;align-items:center;gap:6px;margin:3px 0}
.coul input[type=color]{width:34px;height:26px;padding:0;border:0}
.coul input[type=checkbox]{width:auto}
.previews{display:flex;flex-direction:column;gap:18px;align-items:center}
.scaler{transform-origin:top left}
/* ----- Page A4 paysage (1123 x 794 px) ----- */
.page{width:1123px;height:794px;background:#fff;position:relative;padding:22px 30px 18px;box-shadow:0 6px 30px rgba(30,27,75,.15);font-family:Arial,Helvetica,sans-serif;color:#1e1b4b;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#fbd5ea,#e9d5ff);border-radius:6px;padding:12px 18px;height:68px}
.ph .t{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:900;letter-spacing:.5px}
.ph .t img{height:42px}
.ph .r{text-align:right;font-size:12px;line-height:1.75}
.ph .r b{font-weight:800}
.frame{margin-top:12px;border:2px solid #4c9a2a;border-radius:8px;height:420px;position:relative;overflow:hidden;background:#f6f6f6;display:flex;align-items:center;justify-content:center}
.frame .fond{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:62%;background:linear-gradient(135deg,#c7b8f0 0%,#f6c6df 55%,#f3a6c8 100%)}
.frame canvas{position:relative;z-index:1;cursor:grab}
.frame .legende{position:absolute;left:0;right:0;bottom:8px;z-index:2;text-align:center;font-weight:900;font-size:24px;line-height:1.15;white-space:pre-line;color:#111}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.trio div{background:#f3f3f5;border-radius:6px;padding:6px 10px 8px}
.trio small{display:block;font-size:9px;color:#666;text-transform:uppercase;letter-spacing:.3px}
.trio b{display:block;font-size:13px;border-bottom:1px dashed #bbb;padding-bottom:3px;min-height:19px}
table.t{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;border:1px solid #ddd;border-radius:6px;overflow:hidden;font-size:11px}
table.t th{background:#1f1b4d;color:#fff;text-align:left;font-size:10px;letter-spacing:.3px;padding:7px 10px}
table.t td{padding:8px 10px;vertical-align:top;white-space:pre-line}
.zone{font-weight:800;font-size:11px;padding:2px 10px 8px}
.pied{position:absolute;left:30px;right:30px;bottom:12px;font-size:8.5px;color:#555;display:flex;justify-content:space-between;gap:20px}
.pied .sig{border:1px solid #bbb;border-radius:4px;width:220px;height:34px;padding:3px 6px;font-size:8.5px;flex:none}
</style>
</head>
<body>
<header class="bar">
  <a href="/gestion/commandes#bat">← BAT</a>
  <h1 id="titre">Générateur de BAT</h1>
  <button class="btn" id="dl" disabled>⬇ Télécharger le PDF</button>
  <button class="btn pink" id="save" disabled>💾 Enregistrer dans le dossier</button>
</header>
<div class="wrap">
  <div>
    <div class="tabs" id="tabs"></div>
    <div class="previews" id="previews"><div class="card">Chargement de la commande…</div></div>
  </div>
  <div class="side">
    <div class="card" id="reglages"></div>
    <div class="card"><div class="note">Glisse un logo sur un mockup pour le déplacer (le réglage s'applique à toutes les couleurs de la page). Les tailles sont en cm réels : la taille des logos suit la largeur réelle du vêtement (fournisseur, taille M).</div><div class="msg" id="msg"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';
// ============================================
// GÉNÉRATEUR DE BAT - IGS CUSTOM BAR
// Gabarits blancs recolorés, logos placés à l'échelle (cm réels), une page par visuel, PDF A4 paysage.
// ============================================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const cle = decodeURIComponent(location.pathname.split('/').pop());

// ---------- Produits : gabarit, mesures fournisseur (A = longueur, B = largeur à plat, taille M) ----------
// x/y des zones en cm : x depuis le centre du corps (positif = côté cœur, à droite à l'écran), y depuis le haut du vêtement
const PRODUITS = {
  tshirt:    { nom: 'T-shirt', avant: 'tshirt-avant', dos: 'tshirt-dos', A: 72, B: 53, femme: [63, 44], enfant: [49, 38],
               zones: { coeur: { x: 9, y: 15 }, poitrine: { x: 0, y: 13 }, dos: { x: 0, y: 10 }, bas: { x: 0, yBas: 7 }, manche: { fx: 0.12, fy: 0.27, rot: -35 } } },
  polo:      { nom: 'Polo', avant: 'polo-avant', dos: 'polo-dos', A: 72, B: 53, femme: [63, 46],
               zones: { coeur: { x: 9, y: 17 }, poitrine: { x: 0, y: 18 }, dos: { x: 0, y: 11 }, bas: { x: 0, yBas: 7 }, manche: { fx: 0.12, fy: 0.27, rot: -35 } } },
  debardeur: { nom: 'Débardeur', avant: 'debardeur-avant', dos: 'debardeur-dos', A: 68, B: 47, femme: [66, 43],
               zones: { coeur: { x: 8, y: 17 }, poitrine: { x: 0, y: 16 }, dos: { x: 0, y: 12 }, bas: { x: 0, yBas: 7 } } },
  tote:      { nom: 'Tote bag', avant: 'tote', dos: 'tote', A: 42, B: 38, tote: true,
               zones: { centre: { x: 0, yCentre: 21 } } },
};
function produitDe(type){
  const t = norm(type);
  if (/tote|sac/.test(t)) return 'tote';
  if (/polo/.test(t)) return 'polo';
  if (/debardeur|marcel|tank/.test(t)) return 'debardeur';
  if (/t-?shirt|tee|tshirt|col v|longue/.test(t)) return 'tshirt';
  return null;
}
// ---------- Couleurs du nuancier ----------
const COULEURS = {
  'noir profond':'#1b1b1d','noir':'#1b1b1d','gris fonce':'#4b4e56','gris clair':'#b8b9bd','gris':'#8d8f94','blanc':'#ffffff',
  'rose bonbon':'#f6a9c8','rose':'#f6a9c8','fuchsia':'#d6197a','bordeaux':'#6b1e30','rouge':'#c8102e','hibiscus':'#e83e5f',
  'orange':'#f26a21','jaune citron':'#f3e04f','jaune gold':'#f2b705','jaune':'#f3d34a','vert pomme':'#69bd47','vert prairie':'#2c9a46',
  'vert bouteille':'#0f4a2c','vert':'#2c9a46','kaki fonce':'#4d4a2d','kaki':'#6b6a3d','terre':'#8b5a3c','chocolat':'#4a2e23',
  'violet fonce':'#4a2a6b','violet':'#5b2d8a','marine':'#1b2440','french marine':'#23305d','royal':'#1f4ea3','bleu royal':'#1f4ea3',
  'aqua':'#19b4c8','bleu atoll':'#0e7fb4','ciel':'#8fcaec','bleu ciel':'#8fcaec','bleu':'#1f4ea3','sable':'#d9c49d','beige':'#d9c49d',
};
function hexCouleur(nom){
  const n = norm(nom);
  if (COULEURS[n]) return COULEURS[n];
  const k = Object.keys(COULEURS).sort((a,b) => b.length - a.length).find(k => n.includes(k));
  return k ? COULEURS[k] : '#9ca3af';
}
// ---------- Zones de flocage ("Cœur (9cm) + Dos (27cm)") ----------
const ZONES = { coeur: { lib: 'Cœur', face: 'avant', l: 9 }, poitrine: { lib: 'Poitrine', face: 'avant', l: 25 }, dos: { lib: 'Dos', face: 'dos', l: 27 },
                manche: { lib: 'Manche', face: 'avant', l: 7 }, bas: { lib: 'Bas de tee-shirt', face: 'avant', l: 10 }, centre: { lib: 'Centre', face: 'avant', l: 25 } };
function zoneDe(lib){
  const n = norm(lib);
  if (/coeur|cœur|poitrine gauche/.test(n)) return 'coeur';
  if (/dos|arriere/.test(n)) return 'dos';
  if (/manche/.test(n)) return 'manche';
  if (/bas/.test(n)) return 'bas';
  if (/poitrine|devant|face|avant|centre/.test(n)) return 'poitrine';
  return 'poitrine';
}
function parserZones(txt){
  return String(txt || '').split('+').map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/\(?\s*(\d+(?:[.,]\d+)?)\s*cm/i);
    const z = zoneDe(s);
    return { zone: z, libelle: s.replace(/\s+/g, ' '), largeur: m ? Number(m[1].replace(',', '.')) : ZONES[z].l };
  });
}

// ---------- Chargement des images ----------
const cacheImg = new Map();
function charger(url){
  if (!cacheImg.has(url)) cacheImg.set(url, new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Image introuvable : ' + url)); i.src = url; }));
  return cacheImg.get(url);
}
// Mesure du gabarit : corps (largeur à 60 % de la hauteur), centre, haut du corps du tote
const mesures = new Map();
async function gabarit(nom){
  const img = await charger('/gestion/gabarits/' + nom + '.png');
  if (!mesures.has(nom)) {
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    const ligne = fr => { const y = Math.round(img.height * fr); const d = x.getImageData(0, y, img.width, 1).data; let a = -1, b = -1;
      for (let i = 0; i < img.width; i++) if (d[i*4+3] > 40) { if (a < 0) a = i; b = i; } return [a, b]; };
    const [l, r] = ligne(nom === 'tote' ? 0.75 : 0.6);
    let hautCorps = 0;
    if (nom === 'tote') { for (let fr = 0.2; fr < 0.8; fr += 0.01) { const [a, b] = ligne(fr); if (b - a > (r - l) * 0.9) { hautCorps = Math.round(img.height * fr); break; } } }
    mesures.set(nom, { img, corps: r - l, cx: (l + r) / 2, hautCorps });
  }
  return mesures.get(nom);
}
// Logo : option "fond blanc transparent" (JPG avec fond blanc)
const cacheLogo = new Map();
async function logo(id, sansBlanc){
  const k = id + (sansBlanc ? '|b' : '');
  if (!cacheLogo.has(k)) cacheLogo.set(k, (async () => {
    const img = await charger('/gestion/api/fichier/' + encodeURIComponent(id));
    if (!sansBlanc) return img;
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height);
    for (let i = 0; i < d.data.length; i += 4) { const m = Math.min(d.data[i], d.data[i+1], d.data[i+2]); if (m > 235) d.data[i+3] = 0; else if (m > 215) d.data[i+3] = Math.min(d.data[i+3], (235 - m) * 12); }
    x.putImageData(d, 0, 0); return c;
  })());
  return cacheLogo.get(k);
}

// ---------- État ----------
let C = null, D = null, pages = [], courante = 0;
const RESOLUTION = 2; // canvas des mockups en double résolution (net à l'impression)

function msg(t, k){ const m = $('msg'); m.className = 'msg on ' + k; m.innerHTML = t; }

async function init(){
  try {
    const rc = await fetch('/gestion/api/commandes'); if (rc.status === 401) return location.href = '/gestion/auth/login';
    const jc = await rc.json();
    C = (jc.commandes || []).find(x => x.cle === cle);
    if (!C) throw new Error('Commande introuvable (elle est peut-être livrée ou supprimée)');
    $('titre').textContent = 'Générateur de BAT · ' + (C.n_devis || '') + ' · ' + C.client;
    const rd = await fetch('/gestion/api/commandes/' + encodeURIComponent(C.n_devis) + '/dossier');
    D = await rd.json();
    if (D.erreur) throw new Error(D.erreur);
    if (!D.trouve) throw new Error('Dossier de la commande introuvable dans SharePoint');
    construirePages();
    if (!pages.length) throw new Error('Aucun visuel dans le dossier : impossible de faire le BAT');
    afficherTout();
    $('dl').disabled = false; $('save').disabled = false;
    if (D.bat) msg('ℹ️ Un « BON A TIRER.pdf » existe déjà dans le dossier : l\'enregistrement le remplacera.', 'info');
  } catch(e){ $('previews').innerHTML = '<div class="card msg on err">' + esc(e.message) + '</div>'; }
}

// Une page par visuel ; couleurs, produits et tailles tirés du tableau des tailles du client
function construirePages(){
  const visuels = D.visuels || [];
  const groupes = (D.tailles && D.tailles.groupes) || [];
  const zonesCmd = parserZones(C.zone_flocage);
  const imagesDe = v => (v ? v.images : visuels.flatMap(x => x.images));
  const sources = groupes.length ? groupes.map(g => ({ g, v: visuels.find(v => v.nom === g.dossierVisuel) || (groupes.length === 1 && visuels.length === 1 ? visuels[0] : null) }))
                                 : (visuels.length ? visuels.map(v => ({ g: null, v })) : []);
  pages = sources.map(({ g, v }, i) => {
    const imgs = imagesDe(v);
    const avant = imgs.find(x => x.face === 'avant') || imgs.find(x => x.face === 'autre') || imgs[0];
    const arriere = imgs.find(x => x.face === 'arriere');
    // Articles : (produit, couleur, coupe) avec quantités
    const lignes = g ? g.lignes : [];
    const articles = [];
    for (const l of lignes) {
      const produit = produitDe(l.type) || 'tshirt';
      const coupe = /femme/i.test(l.coupe || '') ? 'femme' : (/enfant|\b\d+\s*a(ns)?\b/i.test((l.type || '') + ' ' + (l.taille || '')) ? 'enfant' : '');
      const k = produit + '|' + norm(l.couleur) + '|' + coupe;
      let a = articles.find(x => x.k === k);
      if (!a) articles.push(a = { k, produit, type: l.type || PRODUITS[produit].nom, couleur: l.couleur || 'Blanc', hex: hexCouleur(l.couleur || 'Blanc'), coupe, qte: 0, actif: true });
      a.qte += l.quantite || 0;
    }
    if (!articles.length) articles.push({ k: 'tshirt|blanc|', produit: 'tshirt', type: 'T-shirt', couleur: 'Blanc', hex: '#ffffff', coupe: '', qte: 0, actif: true });
    // Placements : zones de la commande, logo Avant sur les zones de face, Arrière sur le dos
    let zones = zonesCmd.length ? zonesCmd : [ ...(avant ? [{ zone: 'poitrine', libelle: 'Poitrine (25cm)', largeur: 25 }] : []), ...(arriere ? [{ zone: 'dos', libelle: 'Dos (27cm)', largeur: 27 }] : []) ];
    const placements = zones.map(z => {
      const img = ZONES[z.zone].face === 'dos' ? (arriere || null) : (avant || null);
      return img ? { zone: z.zone, libelle: z.libelle, largeur: z.largeur, image: img.id, dx: 0, dy: 0, rot: null, sansBlanc: false } : null;
    }).filter(Boolean);
    // Tailles par couleur : "Noir : 10 S / 20 M"
    const parCouleur = {};
    for (const l of lignes) { const k = (l.couleur || '—') + (/femme/i.test(l.coupe || '') ? ' (femme)' : ''); (parCouleur[k] = parCouleur[k] || []).push(l.quantite + ' ' + l.taille); }
    const tailles = Object.entries(parCouleur).map(([c, t]) => c + ' : ' + t.join(' / ')).join('\n');
    const total = lignes.reduce((t, l) => t + (l.quantite || 0), 0);
    const avantZ = placements.filter(z => ZONES[z.zone].face === 'avant' && z.zone !== 'manche').map(z => z.libelle).join(' + ');
    const dosZ = placements.filter(z => z.zone === 'dos').map(z => z.libelle).join(' + ');
    const autres = placements.filter(z => z.zone === 'manche').map(z => z.libelle).join(' + ');
    return {
      titre: (v && v.nom) || (g && g.visuel) || ('Visuel ' + (i + 1)), images: imgs, articles, placements,
      modele: [...new Set(articles.map(a => a.type))].join(' & '),
      couleur: [...new Set(articles.map(a => a.couleur))].join(' & '),
      quantite: total ? String(total) : '', tailles, face: avantZ, dos: dosZ, autres,
      zone: placements.map(z => z.libelle).join(' + ') || C.zone_flocage || '', legende: '',
    };
  });
}

// ---------- Rendu d'un mockup (gabarit recoloré + logos) ----------
function dims(a){
  const p = PRODUITS[a.produit];
  if (a.coupe === 'femme' && p.femme) return { A: p.femme[0], B: p.femme[1] };
  if (a.coupe === 'enfant' && p.enfant) return { A: p.enfant[0], B: p.enfant[1] };
  return { A: p.A, B: p.B };
}
// Rectangle du logo dans le repère du gabarit (px du gabarit)
function rectLogo(pl, a, face, m, img){
  const p = PRODUITS[a.produit], { A, B } = dims(a);
  const pxW = m.corps / B, pxH = p.tote ? pxW : m.img.height / A;
  const zd = p.tote ? p.zones.centre : (p.zones[pl.zone] || p.zones.poitrine);
  const w = pl.largeur * pxW, h = w * (img.height / img.width);
  let cx, top;
  if (p.tote) { cx = m.cx + (zd.x + pl.dx) * pxW; top = m.hautCorps + (zd.yCentre + pl.dy) * pxH - h / 2; }
  else if (zd.fx != null) { cx = m.img.width * zd.fx + pl.dx * pxW; top = m.img.height * zd.fy + pl.dy * pxH - h / 2; }
  else if (zd.yBas != null) { cx = m.cx + (zd.x + pl.dx) * pxW; top = m.img.height - (zd.yBas - pl.dy) * pxH - h; }
  else { cx = m.cx + (zd.x + pl.dx) * pxW; top = (zd.y + pl.dy) * pxH; }
  return { x: cx - w / 2, y: top, w, h, rot: pl.rot != null ? pl.rot : (zd.rot || 0), pxW, pxH };
}
function placementsDe(page, face, a){
  const p = PRODUITS[a.produit];
  // Zone non prévue sur ce produit (ex. manche sur un débardeur) : placée comme une poitrine, ajustable à la main
  return page.placements.filter(pl => ZONES[pl.zone].face === face);
}
async function vignette(page, a, face){
  const p = PRODUITS[a.produit];
  const m = await gabarit(face === 'dos' ? p.dos : p.avant);
  const c = document.createElement('canvas'); c.width = m.img.width; c.height = m.img.height;
  const x = c.getContext('2d');
  // Recoloration : couleur pleine x gabarit blanc (ombres conservées), découpée à la forme du gabarit
  x.fillStyle = a.hex; x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'multiply'; x.drawImage(m.img, 0, 0);
  x.globalCompositeOperation = 'destination-in'; x.drawImage(m.img, 0, 0);
  x.globalCompositeOperation = 'source-over';
  const zonesHit = [];
  for (const pl of placementsDe(page, face, a)) {
    const img = await logo(pl.image, pl.sansBlanc).catch(() => null); if (!img) continue;
    const r = rectLogo(pl, a, face, m, img);
    x.save(); x.translate(r.x + r.w / 2, r.y + r.h / 2); x.rotate(r.rot * Math.PI / 180); x.drawImage(img, -r.w / 2, -r.h / 2, r.w, r.h); x.restore();
    zonesHit.push({ pl, r });
  }
  return { canvas: c, hits: zonesHit, m };
}
// Toutes les vignettes de la page dans un seul canvas (devant puis dos pour chaque couleur)
async function dessinerMockups(i){
  const page = pages[i], el = document.querySelector('#page' + i + ' canvas'); if (!el) return;
  const items = [];
  for (const a of page.articles.filter(a => a.actif)) {
    const faces = ['avant', 'dos'].filter(f => placementsDe(page, f, a).length || (f === 'avant' && !page.placements.length));
    for (const f of faces) items.push({ a, f, v: await vignette(page, a, f) });
  }
  const W = 1059, H = page.legende.trim() ? 330 : 412;
  el.width = W * RESOLUTION; el.height = H * RESOLUTION; el.style.width = W + 'px'; el.style.height = H + 'px';
  const x = el.getContext('2d'); x.clearRect(0, 0, el.width, el.height);
  const n = items.length || 1, rangs = n <= 4 ? 1 : 2, cols = Math.ceil(n / rangs);
  const cw = Math.min(W / cols, 260 * (rangs === 1 ? 1.35 : 1)), ch = H / rangs, total = cw * cols, x0 = (W - total) / 2;
  page._cells = [];
  items.forEach((it, k) => {
    const col = k % cols, row = Math.floor(k / cols);
    const im = it.v.canvas, s = Math.min((cw - 10) / im.width, (ch - 12) / im.height);
    const w = im.width * s, h = im.height * s, px = x0 + col * cw + (cw - w) / 2, py = row * ch + (ch - h) / 2;
    x.drawImage(im, px * RESOLUTION, py * RESOLUTION, w * RESOLUTION, h * RESOLUTION);
    page._cells.push({ px, py, s, it });
  });
}

// ---------- Page HTML (aperçu = rendu PDF) ----------
function pageHtml(p, i){
  const d = new Date().toLocaleDateString('fr-FR');
  const ed = (k, v, ph) => '<span contenteditable="true" data-i="' + i + '" data-k="' + k + '"' + (ph ? ' data-ph="' + esc(ph) + '"' : '') + '>' + esc(v) + '</span>';
  return '<div class="scaler" id="sc' + i + '"><div class="page" id="page' + i + '">'
    + '<div class="ph"><div class="t"><img src="/gestion/gabarits/logo-igs.png" alt="">BON A TIRER</div>'
    + '<div class="r"><b>Ref devis :</b> ' + esc(C.n_devis) + ' &nbsp;<b>Date du BAT :</b> ' + d + '<br><b>Client :</b> ' + esc(C.client) + ' &nbsp;<b>Email :</b> ' + esc(C.email || '') + '</div></div>'
    + '<div class="frame"><div class="fond"></div><canvas></canvas>' + (p.legende.trim() ? '<div class="legende">' + esc(p.legende) + '</div>' : '') + '</div>'
    + '<div class="trio"><div><small>Modèle</small><b>' + ed('modele', p.modele) + '</b></div><div><small>Couleur</small><b>' + ed('couleur', p.couleur) + '</b></div><div><small>Quantité</small><b>' + ed('quantite', p.quantite) + '</b></div></div>'
    + '<table class="t"><tr><th style="width:22%">DESCRIPTION</th><th style="width:22%">TAILLES</th><th>FACE</th><th>DOS</th><th>AUTRES</th></tr>'
    + '<tr><td>ZONE DE FLOCAGE' + (pages.length > 1 ? '<br><b>Visuel : ' + esc(p.titre) + '</b>' : '') + '</td><td>' + ed('tailles', p.tailles) + '</td><td>' + ed('face', p.face) + '</td><td>' + ed('dos', p.dos) + '</td><td>' + ed('autres', p.autres) + '</td></tr>'
    + '<tr><td colspan="5" class="zone">' + ed('zone', p.zone) + '</td></tr></table>'
    + '<div class="pied"><div>En validant ce document, le client autorise la mise en production. IGS Custom Bar ne pourra être tenu responsable d\'un résultat insuffisant dû à des visuels de basse résolution ou à des informations incorrectes.<br>IGS CUSTOM BAR - 62 Rue Louis Vatable, 97110 Pointe-à-Pitre - contact@igscustom.fr - 0690 69 18 63 - SIRET : 99175789900026'
    + (pages.length > 1 ? ' · Page ' + (i + 1) + '/' + pages.length : '') + '</div><div class="sig">Signature client (bon pour accord) :</div></div>'
    + '</div></div>';
}
function ajusterEchelle(){
  const dispo = $('previews').clientWidth;
  pages.forEach((p, i) => { const sc = $('sc' + i); if (!sc) return; const s = Math.min(1, dispo / 1123); sc.style.transform = 'scale(' + s + ')'; sc.style.height = (794 * s) + 'px'; sc.style.width = (1123 * s) + 'px'; });
}
async function afficherTout(){
  $('tabs').innerHTML = pages.length > 1 ? pages.map((p, i) => '<button class="tab' + (i === courante ? ' on' : '') + '" data-p="' + i + '">' + esc(p.titre) + '</button>').join('') : '';
  $('previews').innerHTML = pages.map(pageHtml).join('');
  ajusterEchelle();
  for (let i = 0; i < pages.length; i++) await dessinerMockups(i);
  reglages();
}

// ---------- Panneau de réglages de la page courante ----------
function reglages(){
  const p = pages[courante]; if (!p) return;
  const optImg = sel => p.images.map(im => '<option value="' + esc(im.id) + '"' + (im.id === sel ? ' selected' : '') + '>' + esc(im.nom) + '</option>').join('');
  const optZone = sel => Object.entries(ZONES).map(([k, z]) => '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + z.lib + '</option>').join('');
  $('reglages').innerHTML = '<h3>Réglages · ' + esc(p.titre) + '</h3>'
    + '<label class="f">Logos</label>'
    + p.placements.map((pl, k) => '<div class="pl" data-k="' + k + '"><div class="row"><select data-f="zone">' + optZone(pl.zone) + '</select><select data-f="image">' + optImg(pl.image) + '</select></div>'
      + '<div class="row"><label class="note">Largeur (cm)</label><input type="number" step="0.5" min="1" max="60" data-f="largeur" value="' + pl.largeur + '"><label class="note">Rotation</label><input type="number" step="5" data-f="rot" value="' + (pl.rot ?? '') + '" placeholder="auto"></div>'
      + '<div class="row"><label class="note" style="flex:2"><input type="checkbox" data-f="sansBlanc"' + (pl.sansBlanc ? ' checked' : '') + ' style="width:auto"> Fond blanc transparent</label><button class="btn" data-a="reset" title="Revenir à la position standard">↺</button><button class="btn" data-a="suppr" title="Retirer ce logo">✕</button></div></div>').join('')
    + '<button class="btn" data-a="ajout">＋ Ajouter un logo</button>'
    + '<label class="f">Couleurs et produits</label>'
    + p.articles.map((a, k) => '<div class="coul" data-c="' + k + '"><input type="checkbox" data-f="actif"' + (a.actif ? ' checked' : '') + '><input type="color" data-f="hex" value="' + a.hex + '"><span style="flex:1">' + esc(a.couleur) + ' <span class="note">· ' + esc(a.type) + (a.coupe ? ' ' + a.coupe : '') + (a.qte ? ' · ' + a.qte : '') + '</span></span>'
      + '<select data-f="produit" style="width:105px">' + Object.entries(PRODUITS).map(([k, x]) => '<option value="' + k + '"' + (k === a.produit ? ' selected' : '') + '>' + x.nom + '</option>').join('') + '</select></div>').join('')
    + '<button class="btn" data-a="ajoutCouleur" style="margin-top:4px">＋ Couleur</button>'
    + '<label class="f">Texte dans le cadre (facultatif)</label><textarea data-f="legende" placeholder="ex. jude : Taille S (x2) bleu royal">' + esc(p.legende) + '</textarea>'
    + '<div class="note" style="margin-top:6px">Les champs Modèle, Couleur, Tailles, Face, Dos… se modifient directement sur l\'aperçu.</div>';
}
let attente = null;
const redessiner = (complet) => { clearTimeout(attente); attente = setTimeout(async () => { if (complet) { await afficherTout(); } else { await dessinerMockups(courante); } }, 120); };
$('reglages').addEventListener('input', e => {
  const p = pages[courante], t = e.target, f = t.dataset.f; if (!f) return;
  const pl = t.closest('.pl'), co = t.closest('.coul');
  if (pl) { const o = p.placements[pl.dataset.k];
    if (f === 'largeur') o.largeur = Math.max(1, Number(t.value) || 1);
    else if (f === 'rot') o.rot = t.value === '' ? null : Number(t.value);
    else if (f === 'sansBlanc') o.sansBlanc = t.checked;
    else if (f === 'zone') { o.zone = t.value; o.dx = 0; o.dy = 0; o.largeur = ZONES[t.value].l; o.libelle = ZONES[t.value].lib + ' (' + o.largeur + 'cm)'; reglages(); }
    else if (f === 'image') o.image = t.value;
    return redessiner();
  }
  if (co) { const a = p.articles[co.dataset.c];
    if (f === 'actif') a.actif = t.checked; else if (f === 'hex') a.hex = t.value; else if (f === 'produit') a.produit = t.value;
    return redessiner();
  }
  if (f === 'legende') { p.legende = t.value; return redessiner(true); }
});
$('reglages').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const p = pages[courante], k = b.closest('.pl') && Number(b.closest('.pl').dataset.k);
  if (b.dataset.a === 'suppr') p.placements.splice(k, 1);
  if (b.dataset.a === 'reset') Object.assign(p.placements[k], { dx: 0, dy: 0, rot: null });
  if (b.dataset.a === 'ajout' && p.images.length) p.placements.push({ zone: 'poitrine', libelle: 'Poitrine (25cm)', largeur: 25, image: p.images[0].id, dx: 0, dy: 0, rot: null, sansBlanc: false });
  if (b.dataset.a === 'ajoutCouleur') { const nom = prompt('Couleur (ex. Noir profond, Marine, Blanc) :'); if (!nom) return; p.articles.push({ k: 'x' + Date.now(), produit: p.articles[0] ? p.articles[0].produit : 'tshirt', type: p.articles[0] ? p.articles[0].type : 'T-shirt', couleur: nom, hex: hexCouleur(nom), coupe: '', qte: 0, actif: true }); }
  reglages(); redessiner();
});
$('tabs').addEventListener('click', e => { const t = e.target.closest('[data-p]'); if (!t) return; courante = Number(t.dataset.p); document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t)); reglages(); $('page' + courante).scrollIntoView({ behavior: 'smooth', block: 'start' }); });
// Champs modifiables directement sur l'aperçu
$('previews').addEventListener('input', e => { const t = e.target.closest('[contenteditable]'); if (!t) return; pages[t.dataset.i][t.dataset.k] = t.innerText; });

// ---------- Glisser un logo sur un mockup ----------
let drag = null;
function pointCanvas(e, canvas){
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (canvas.width / RESOLUTION) / r.width, y: (e.clientY - r.top) * (canvas.height / RESOLUTION) / r.height };
}
$('previews').addEventListener('pointerdown', e => {
  const cv = e.target.closest('.frame canvas'); if (!cv) return;
  const i = Number(cv.closest('.page').id.replace('page', '')), p = pages[i]; if (!p._cells) return;
  const pt = pointCanvas(e, cv);
  for (const cell of p._cells) {
    const gx = (pt.x - cell.px) / cell.s, gy = (pt.y - cell.py) / cell.s;
    const hit = cell.it.v.hits.slice().reverse().find(h => gx >= h.r.x && gx <= h.r.x + h.r.w && gy >= h.r.y && gy <= h.r.y + h.r.h);
    if (hit) {
      courante = i; reglages();
      drag = { i, cv, cell, pl: hit.pl, r: hit.r, x0: pt.x, y0: pt.y, dx0: hit.pl.dx, dy0: hit.pl.dy, sens: 1 };
      cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; e.preventDefault(); return;
    }
  }
});
$('previews').addEventListener('pointermove', e => {
  if (!drag) return;
  const pt = pointCanvas(e, drag.cv);
  const ddx = (pt.x - drag.x0) / drag.cell.s / drag.r.pxW, ddy = (pt.y - drag.y0) / drag.cell.s / drag.r.pxH;
  drag.pl.dx = Math.round((drag.dx0 + ddx * drag.sens) * 2) / 2; drag.pl.dy = Math.round((drag.dy0 + ddy) * 2) / 2;
  redessiner();
});
$('previews').addEventListener('pointerup', () => { if (drag) { drag.cv.style.cursor = 'grab'; drag = null; } });
window.addEventListener('resize', ajusterEchelle);

// ---------- PDF ----------
async function genererPdf(){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  for (let i = 0; i < pages.length; i++) {
    const sc = $('sc' + i), t = sc.style.transform; sc.style.transform = 'none';
    try {
      const canvas = await html2canvas($('page' + i), { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
      if (i) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 297, 210);
    } finally { sc.style.transform = t; }
  }
  return pdf;
}
$('dl').onclick = async () => {
  $('dl').disabled = true; msg('Création du PDF…', 'info');
  try { (await genererPdf()).save('BON A TIRER - ' + (C.n_devis || '') + '.pdf'); msg('✅ PDF téléchargé', 'ok'); }
  catch(e){ msg('❌ ' + esc(e.message), 'err'); } finally { $('dl').disabled = false; }
};
$('save').onclick = async () => {
  if (D.bat && !confirm('Remplacer le « BON A TIRER.pdf » existant dans le dossier ?')) return;
  $('save').disabled = true; msg('Création du PDF et dépôt dans le dossier SharePoint…', 'info');
  try {
    const blob = (await genererPdf()).output('blob');
    const fd = new FormData(); fd.append('pdf', blob, 'BON A TIRER.pdf');
    const r = await fetch('/gestion/api/commandes/' + encodeURIComponent(cle) + '/bat-pdf', { method: 'POST', body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Erreur ' + r.status);
    D.bat = true;
    msg('✅ « BON A TIRER.pdf » enregistré dans le dossier. <a href="/gestion/commandes#bat">Retour à l\'onglet BAT</a> pour l\'envoyer au client.', 'ok');
  } catch(e){ msg('❌ ' + esc(e.message), 'err'); } finally { $('save').disabled = false; }
};
